name: Daily stock refresh

on:
  schedule:
    # 12:00 UTC daily — same time the old vercel.json cron used.
    # NSE closes 10:00 UTC (3:30pm IST), so this runs ~2hrs after close.
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Call /api/cron/refresh on Render
        run: |
          curl -f -sS --max-time 900 \
            -X GET "${{ secrets.APP_BASE_URL }}/api/cron/refresh" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
