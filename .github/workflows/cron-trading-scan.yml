name: Daily trading scan

on:
  schedule:
    # 10:30 UTC daily — same time the old vercel.json cron used
    # (4:00pm IST, shortly after NSE close at 3:30pm IST).
    - cron: '30 10 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  trigger-trading-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Call /api/cron/trading-scan on Render
        run: |
          curl -f -sS --max-time 900 \
            -X GET "${{ secrets.APP_BASE_URL }}/api/cron/trading-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
